<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English Base</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #fffdf8 0%, #eef3f8 100%);
        color: #183153;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #183153;
        color: #fffdf8;
        font-size: 42px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      p {
        margin: 0;
        color: #536171;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">E</div>
      <h1>English Base</h1>
      <p>読み込み中...</p>
    </main>
  </body>
</html>
